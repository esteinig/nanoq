[package]
name = "nanoq"
version = "0.11.0"
authors = ["esteinig <eike.steinig@unimelb.edu.au>", "ljmcoin <lachlan.coin@unimelb.edu.au>"]
description = "Minimal but speedy quality control and summaries of nanopore reads"
documentation = "https://github.com/esteinig/nanoq"
homepage = "https://github.com/esteinig/nanoq"
repository = "https://github.com/esteinig/nanoq"
readme = "README.md"
keywords = ["nanopore", "ont", "summary", "filter", "read"]
categories = ["science"]
license = "MIT"
edition = "2021"
include = [
    "**/*.rs",
    "Cargo.toml"
]

[dependencies]
anstyle = "1.0.8"
clap = { version = "4.5.13", features = ["derive", "unstable-styles", "cargo"] }
env_logger = "0.11.5"
log = "0.4.22"
needletail = "0.5.1"
niffler = "2.5"
termcolor = "1.4.1"
thiserror = "1.0.63"


[dev-dependencies]
assert_cmd = "2.0.1"
predicates = "1"
tempfile = "3.1.0"
